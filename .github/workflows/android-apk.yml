name: Android APK
on:
  push:
    branches: [android-native]
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-java@v5
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Install pinned Android SDK
        id: sdk
        run: python3 android/tools/setup-ci-sdk.py
      - name: Test Android adapters and league behavior
        id: tests
        working-directory: android
        run: node --test tests/*.test.cjs
      - name: Prepare checksum-verified French model
        id: voice_model
        run: python3 android/tools/prepare_voice_model.py
      - name: Compile and lint Android
        id: build
        working-directory: android
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug > "$RUNNER_TEMP/cosom-build.log" 2>&1; then
            cat "$RUNNER_TEMP/cosom-build.log"
            node -e 'const fs=require("node:fs"),util=require("node:util"); for(const line of util.stripVTControlCharacters(fs.readFileSync(process.argv[1],"utf8")).split("\n").filter(line=>/error|failed|exception|not found/i.test(line)).slice(-12)) console.log("::error title=Android build::"+line.replaceAll("%","%25").replaceAll("\r","%0D"));' "$RUNNER_TEMP/cosom-build.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cosom-build.log"
      - name: Verify installable APK checksum
        working-directory: android/releases
        run: sha256sum --check SHA256SUMS
      - name: Verify installable APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android/releases/Cosom-Android-1.0.0-preview.3.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cosom-Android-preview
          path: |
            android/releases/Cosom-Android-1.0.0-preview.3.apk
            android/releases/SHA256SUMS
            android/signing-certificate.txt
          if-no-files-found: error
      - name: Identify failed Android setup step
        if: failure()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node -e 'for(const [id,step] of Object.entries(JSON.parse(process.env.STEP_RESULTS))) if(step.outcome==="failure") console.log("::error title=Android CI::Failed step - "+id)'

  publish-apk:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          name: Cosom Android 1.0.0 — preview 3
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Remplace les sessions de dictée Android par une capture AudioRecord continue et un moteur Vosk français local.
            Le micro ne redémarre pas entre les phrases ou pendant le silence. Aucun son de démarrage de Google SpeechRecognizer.
            Le laboratoire ne se met plus en pause après un résultat ou un délai. Arrêt par le bouton ou « arrête le test » ; arrêt du micro en arrière-plan.
            APK plus grosse : modèle français embarqué. Reconnaissance des noms et fonctionnement au gym à confirmer sur téléphone.
            Installer par-dessus la précédente, sans désinstaller : même package et même signature, code de version 3. PWA inchangée.
          files: |
            android/releases/*.apk
            android/releases/SHA256SUMS
            android/signing-certificate.txt
