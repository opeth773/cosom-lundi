name: Android APK
on:
  push:
    branches: [android-native]
    tags: ['android-v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        id: checkout
      - uses: actions/setup-java@v5
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: '22'
      - name: Install pinned Android SDK
        id: sdk
        run: python3 android/tools/setup-ci-sdk.py
      - name: Test Android adapters and league behavior
        id: tests
        working-directory: android
        run: node --test tests/*.test.cjs
      - name: Prepare checksum-verified French model
        id: voice_model
        run: python3 android/tools/prepare_voice_model.py
      - name: Compile and lint Android
        id: build
        working-directory: android
        run: |
          if ! ./gradlew --no-daemon testDebugUnitTest assembleDebug lintDebug > "$RUNNER_TEMP/cosom-build.log" 2>&1; then
            cat "$RUNNER_TEMP/cosom-build.log"
            node -e 'const fs=require("node:fs"),util=require("node:util"); for(const line of util.stripVTControlCharacters(fs.readFileSync(process.argv[1],"utf8")).split("\n").filter(line=>/error|failed|exception|not found/i.test(line)).slice(-12)) console.log("::error title=Android build::"+line.replaceAll("%","%25").replaceAll("\r","%0D"));' "$RUNNER_TEMP/cosom-build.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/cosom-build.log"
      - name: Verify installable APK checksum
        working-directory: android/releases
        run: sha256sum --check SHA256SUMS
      - name: Verify installable APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android/releases/Cosom-Android-1.0.0-preview.6.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Cosom-Android-preview
          path: |
            android/releases/Cosom-Android-1.0.0-preview.6.apk
            android/releases/SHA256SUMS
            android/signing-certificate.txt
          if-no-files-found: error
      - name: Identify failed Android setup step
        if: failure()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: node -e 'for(const [id,step] of Object.entries(JSON.parse(process.env.STEP_RESULTS))) if(step.outcome==="failure") console.log("::error title=Android CI::Failed step - "+id)'

  publish-apk:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: softprops/action-gh-release@v2
        with:
          name: Cosom Android 1.0.0 — preview 6
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Laboratoire TEST : deux alignements fictifs Pâles et Foncés avec les joueurs de la ligue, modifiables localement, sans dépendre des parties réelles. Surnoms facultatifs pour tester.
            Noms complets proches proposés avec confirmation « oui » ou annulation « non ». Aucun nom approximatif n'est enregistré automatiquement. Les ambiguïtés demandent une précision.
            Formulations des aides plus tolérantes, dont « assisté dans ». Les noms et phrases du vocabulaire sont fournis au moteur vocal.
            Installer par-dessus la précédente : même signature, code de version 6. Capture audio continue et Google fr-CA conservés. PWA inchangée.
          files: |
            android/releases/*.apk
            android/releases/SHA256SUMS
            android/signing-certificate.txt
